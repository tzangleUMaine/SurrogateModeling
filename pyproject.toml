[project]
name = "surrogatemodeling"
version = "0.1.0"
description = ""
authors = [
    {name = "Troy Zangle",email = "troy.zangle@maine.edu"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy (==2.1.1)",
    "torch (>=2.9.0,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "pykan (>=0.2.8,<0.3.0)",
    "scipy (==1.14.1)"
]

[tool.poetry]
# 👇 Tell Poetry where your packages are
packages = [
    { include = "SurrogateModels", from = "src" },
    { include = "examples", from = "src" }
]

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "jupyterlab (>=4.4.10,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
